{% if page.permalink == '/about/' or page.url == '/about/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ProfilePage",
      "@id": "{{ '/about/' | absolute_url }}#profile",
      "url": "{{ '/about/' | absolute_url }}",
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | default: site.description | jsonify }},
      "mainEntity": {
        "@id": "{{ '/' | absolute_url }}#person"
      }
    },
    {
      "@type": "Person",
      "@id": "{{ '/' | absolute_url }}#person",
      "name": "石亮",
      "alternateName": "Liang Shi",
      "url": "{{ '/about/' | absolute_url }}",
      "mainEntityOfPage": "{{ '/about/' | absolute_url }}",
      "image": "{{ site.logo | absolute_url }}",
      "email": "mailto:{{ site.email }}",
      "jobTitle": "UX 设计负责人 / Design Lead",
      "description": {{ page.description | default: site.description | jsonify }},
      "worksFor": {
        "@type": "Organization",
        "name": "Ubiquiti Inc."
      },
      "alumniOf": [
        {
          "@type": "CollegeOrUniversity",
          "name": "Parsons School of Design"
        },
        {
          "@type": "CollegeOrUniversity",
          "name": "Shanghai Jiao Tong University"
        }
      ],
      "knowsAbout": [
        "UX Design",
        "Design Systems",
        "Investment Decision Systems",
        "Expected Value (EV)",
        "Texas Hold'em Poker Strategy"
      ],
      "sameAs": [
        {% if site.social.linkedin %}"{{ site.social.linkedin }}"{% endif %}{% if site.social.github %}{% if site.social.linkedin %},{% endif %}
        "https://github.com/{{ site.social.github }}"{% endif %}{% if site.social.twitter %}{% if site.social.linkedin or site.social.github %},{% endif %}
        "https://twitter.com/{{ site.social.twitter }}"{% endif %}{% if site.social.instagram %}{% if site.social.linkedin or site.social.github or site.social.twitter %},{% endif %}
        "https://www.instagram.com/{{ site.social.instagram }}"{% endif %}
      ]
    }
  ]
}
</script>
{% elsif page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "@id": "{{ page.url | absolute_url }}#breadcrumb",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "首页",
      "item": "{{ '/' | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "文章",
      "item": "{{ '/archive/' | absolute_url }}"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>
{% endif %}
