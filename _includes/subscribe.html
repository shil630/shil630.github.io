{% if site.buttondown_username != "" and site.buttondown_username %}
<section class="subscribe wrap" id="subscribe">
  <div class="subscribe-box">
    <h3 class="subscribe-title">订阅正EV实验</h3>
    <p class="subscribe-desc">不定期更新关于设计、投资、德州与决策的文章。无喊单，无噪音。</p>
    <form class="subscribe-form"
          data-track-cta
          data-cta-type="newsletter"
          data-placement="{% if page.layout == 'post' %}article_footer{% elsif page.url == '/' %}home_footer{% else %}page_footer{% endif %}"
          action="https://buttondown.com/api/emails/embed-subscribe/{{ site.buttondown_username }}"
          method="post" target="_blank">
      <input type="email" name="email" placeholder="you@example.com" required
             aria-label="Email address">
      <button type="submit">加入实验</button>
    </form>
  </div>
</section>
{% endif %}
