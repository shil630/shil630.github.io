{% assign tool_url = page.url | absolute_url %}
{% assign tool_image = page.image | default: site.og_image | absolute_url %}
<title>{{ page.title | escape }}｜{{ site.title | escape }}</title>
<meta name="description" content="{{ page.description | escape }}">
<link rel="canonical" href="{{ tool_url }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ page.title | escape }}｜{{ site.title | escape }}">
<meta property="og:description" content="{{ page.description | escape }}">
<meta property="og:url" content="{{ tool_url }}">
<meta property="og:image" content="{{ tool_image }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | escape }}｜{{ site.title | escape }}">
<meta name="twitter:description" content="{{ page.description | escape }}">
<meta name="twitter:image" content="{{ tool_image }}">
{% include analytics.html %}
