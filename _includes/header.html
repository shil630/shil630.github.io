<header class="site-header" id="site-header">
  <div class="wrap header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">
      <svg class="site-mark" viewBox="0 0 20 20" width="20" height="20" fill="none" aria-hidden="true">
        <rect x="1.75" y="1.75" width="16.5" height="16.5" rx="4.25" stroke="currentColor" stroke-opacity="0.32" stroke-width="1.25"/>
        <path d="M5.5 14.25L9.5 11.25L11.75 12.25L14.75 5.75" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="14.75" cy="5.75" r="2" fill="var(--accent)"/>
      </svg>
      <span class="site-wordmark">石亮正<span class="site-wordmark-ev">EV</span></span>
    </a>

    <nav class="site-nav" aria-label="主导航">
      <div class="header-mobile-actions">
        <button type="button" class="mobile-search-btn" data-cmd-open aria-haspopup="dialog" aria-controls="cmd-palette" aria-label="搜索文章、工具或页面" data-aria-label-zh="搜索文章、工具或页面" data-aria-label-en="Search articles, tools, or pages">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button type="button" id="menu-toggle" class="menu-toggle" popovertarget="site-menu" popovertargetaction="toggle" aria-controls="site-menu" aria-expanded="false" aria-label="打开导航菜单" data-aria-label-zh="打开导航菜单" data-aria-label-en="Open navigation menu">
          <svg class="menu-icon-open" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          <svg class="menu-icon-close" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div id="site-menu" class="site-menu" popover="auto">
        <ul class="site-menu-list">
          <li>
            <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active" aria-current="page"{% endif %}>
              <span data-en="Home" data-zh="首页">首页</span>
            </a>
          </li>
          <li>
            <a href="{{ '/work/' | relative_url }}"{% if page.url contains 'work' %} class="active" aria-current="page"{% endif %}>
              <span data-en="Work" data-zh="作品">作品</span>
            </a>
          </li>
          <li>
            <a href="{{ '/archive/' | relative_url }}"{% if page.url contains 'archive' %} class="active" aria-current="page"{% endif %}>
              <span data-en="Articles" data-zh="文章">文章</span>
            </a>
          </li>
          <li>
            <a href="{{ '/tools/' | relative_url }}"{% if page.url contains 'tools' %} class="active" aria-current="page"{% endif %}>
              <span data-en="Tools" data-zh="工具">工具</span>
            </a>
          </li>
          <li>
            <a href="{{ '/about/' | relative_url }}"{% if page.url contains 'about' %} class="active" aria-current="page"{% endif %}>
              <span data-en="About" data-zh="关于">关于</span>
            </a>
          </li>
        </ul>

        <div class="site-menu-utils">
          <button id="theme-toggle" class="theme-toggle" type="button">
            <span class="theme-opt theme-opt-to-light">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
              <span class="sr-only" data-en="Switch to light theme" data-zh="切换到纸墨浅色模式">切换到纸墨浅色模式</span>
              <span class="theme-toggle-label" aria-hidden="true" data-en="Light" data-zh="浅色">浅色</span>
            </span>
            <span class="theme-opt theme-opt-to-dark">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span class="sr-only" data-en="Switch to dark theme" data-zh="切换到深空仪器模式">切换到深空仪器模式</span>
              <span class="theme-toggle-label" aria-hidden="true" data-en="Dark" data-zh="深色">深色</span>
            </span>
          </button>
          <button id="lang-toggle" class="lang-toggle" type="button" aria-label="切换语言 / Switch language">中 / EN</button>
        </div>
      </div>
    </nav>
  </div>
  {% if page.layout == 'post' %}
  <div class="reading-progress" id="reading-progress"></div>
  {% endif %}
</header>
