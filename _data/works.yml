    eyebrow_en: "01 · SYSTEM"
    title_zh: "跨产品设计系统"
    title_en: "Design System"
    description_zh: "覆盖基础规范、组件库与数据可视化，统一跨产品体验与研发协同。"
    description_en: "Foundations, components, and data visualization unifying cross-product UX and engineering delivery."
    image: "/assets/images/work/unifi-design-system.png"
    alt: "Overview of the UniFi Design System"

  - eyebrow_zh: "02 · 团队与方法"
    eyebrow_en: "02 · LEADERSHIP"
    title_zh: "设计领导力与机制"
    title_en: "Design Leadership"
    description_zh: "通过设计原则与跨产品评审机制，把团队经验沉淀为可复用的决策标准。"
    description_en: "Turning team know-how into repeatable standards through design principles and cross-product critiques."
    image: "/assets/images/work/design-leadership.png"
    alt: "Design workshops and cross-product collaboration"
