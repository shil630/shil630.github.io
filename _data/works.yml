works:
  - slug: "site-manager"
    title: "UniFi Site Manager"
    subtitle_zh: "全域 IT 站点管理系统"
    subtitle_en: "All-in-one multi-site IT management"
    description_zh: "把分散在不同地点的站点、应用与设备收进同一工作台，让多站点 IT 运维清晰且可扩展。"
    description_en: "Unifying distributed sites, apps, and devices into one workspace for clear, scalable IT administration."
    challenge_zh: "如何精简多站点运维流程，兼顾不同规模团队的效率与上手成本？"
    challenge_en: "How to streamline multi-site IT operations across teams of very different scales and expertise?"
    image: "/assets/images/work/unifi-site-manager.png"
    alt: "UniFi Site Manager desktop and mobile interfaces"
    media: "flush"
    tags:
      - "UX Strategy"
      - "Enterprise"
      - "Cross-platform"

  - slug: "console-setup"
    title: "UniFi OS Console Setup"
    subtitle_zh: "企业级网关主机安装配置体验"
    subtitle_en: "Enterprise console setup experience"
    description_zh: "重构软硬件结合的首次开机流程，让非专业 IT 用户也能看懂每一步并独立完成部署。"
    description_en: "Redesigning hardware-and-software onboarding so non-specialists can deploy enterprise consoles with confidence."
    challenge_zh: "如何把复杂的网络设备配置，变成清晰、可控的引导式体验？"
    challenge_en: "How to turn complex network configuration into a guided flow that feels simple and in control?"
    image: "/assets/images/work/unifi-console-setup.png"
    alt: "UniFi OS Console setup across hardware, desktop and mobile"
    media: "flush"
    tags:
      - "Onboarding"
      - "End-to-end Flow"
      - "Hardware + Software"

  - slug: "protect-redesign"
    title: "UniFi Protect Redesign"
    subtitle_zh: "智能物理安防管理系统再设计"
    subtitle_en: "Physical security management redesign"
    description_zh: "面向高密度摄像头部署，重构安防事件的监看、回溯与响应工作流。"
    description_en: "Rebuilding security monitoring, playback, and incident response for high-density camera fleets."
    challenge_zh: "当摄像头与告警数量成倍增长时，如何帮用户第一时间抓住重点？"
    challenge_en: "How to help operators spot what matters and act fast as camera fleets and alerts scale?"
    image: "/assets/images/work/unifi-protect-redesign.png"
    alt: "UniFi Protect security camera management on desktop and mobile"
    media: "flush"
    tags:
      - "Information Architecture"
      - "Physical Security"
      - "Responsive UX"

capabilities:
